<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aybüke'nin Acil Durum Kiti 🚨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #ef4444;
      --primary-hover: #dc2626;
      --text: #1e293b;
      --accent: #3b82f6;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 2rem;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p.sub { color: #64748b; font-size: 0.95rem; margin-top: 0; }
    .panic-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 1.2rem 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #b91c1c;
      transition: all 0.1s ease;
      margin: 1.5rem 0;
      width: 100%;
    }
    .panic-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b91c1c;
    }
    .message-box {
      min-height: 50px;
      padding: 0.8rem;
      background: #f1f5f9;
      border-radius: 10px;
      font-weight: 500;
      color: #334155;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      font-weight: bold;
      margin-bottom: 0.8rem;
    }
    .bubble-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      background: #e2e8f0;
      padding: 12px;
      border-radius: 12px;
    }
    .bubble {
      aspect-ratio: 1;
      background: #bae6fd;
      border: 2px solid #7dd3fc;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .bubble:active { transform: scale(0.9); }
    .bubble.popped {
      background: #cbd5e1;
      border-color: #94a3b8;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
      cursor: default;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Aybüke Stres Kalkanı 🛡️</h1>
    <p class="sub">Yoğunluk, deadline veya anlamsız toplantı anında tıkla.</p>

    <button class="panic-btn" onclick="triggerPanic()">💥 STRESİ İMHA ET</button>
    <div class="message-box" id="quote">Butona basınca stres seviyen analiz edilecek...</div>

    <div class="section-title">Dijital Balon Patlatma Alanı</div>
    <div class="bubble-grid" id="grid"></div>
  </div>

  <script>
    const quotes = [
      "Kahve molası bir lüks değil, anayasal haktır ☕",
      "Bugün gelen acil mailler yarına ertelenince aciliyetini kaybeder 🧘‍♀️",
      "Sistemlerde sorun yok, sorun dünyada. Derin nefes al.",
      "İşler bekleyebilir, senin akıl sağlığın bekleyemez ✨",
      "Şu an evrende her şey yolunda, bir toplantı seni yıkamaz!",
      "5 dakikalık temiz hava yürüyüşü reçete edildi 🌿"
    ];

    function triggerPanic() {
      const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById('quote').innerText = randomQuote;
      confetti({ particleCount: 70, spread: 60, origin: { y: 0.8 } });
    }

    const grid = document.getElementById('grid');
    let poppedCount = 0;
    const totalBubbles = 18;

    for (let i = 0; i < totalBubbles; i++) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.onclick = function() {
        if (!this.classList.contains('popped')) {
          this.classList.add('popped');
          poppedCount++;
          if (poppedCount === totalBubbles) {
            confetti({ particleCount: 150, spread: 90 });
            document.getElementById('quote').innerText = "Tüm balonlar patlatıldı! Stres sıfırlandı 🚀";
          }
        }
      };
      grid.appendChild(bubble);
    }
  </script>
</body>
</html>
